<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>🛡️ Email Safety Assistant</h1>
    <p class="subtitle">Protecting you from scams and phishing</p>
    
    <div class="quick-tips">
      <h3>Quick Safety Tips:</h3>
      <ul>
        <li>Real companies never ask for passwords by email</li>
        <li>Check sender email addresses carefully</li>
        <li>Hover over links before clicking</li>
        <li>Be suspicious of urgent requests</li>
      </ul>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-number" id="emailsChecked">0</span>
        <span class="stat-label">Emails Checked</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="threatsBlocked">0</span>
        <span class="stat-label">Threats Detected</span>
      </div>
    </div>
    
    <button id="learnMore" class="primary-btn">Learn About Email Safety</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
